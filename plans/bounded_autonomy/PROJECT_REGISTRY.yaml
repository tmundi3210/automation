# PROJECT_REGISTRY — deliverable 2 (Phase 1, read-only discovery)
# Source: very-thorough repo inventory 2026-07-13 (git-date-verified statuses).
# Baselines: except where a gate command exists, quality/latency/cost baselines
# do not exist yet -> "baseline: none_recorded" (honest; Phase-8 records them).
# autonomy_level values reference AUTONOMY_POLICY.yaml (L0..L5).
# Scope note: this registry covers the ONE authorized repo (tmundi3210/automation).
# Other projects on the operator's machines are invisible to the hub (see
# ASSUMPTIONS_AND_RISKS.md A6).

_schema:
  status_values: [active, maintained, experimental, parked, archived]
  risk_values: [LOW, MED, HIGH]
  autonomy_note: "L5 (merge/deploy) is NEVER autonomous for any project."

projects:

- id: specialist_factory_core
  name: Specialist Factory + Knowledge-Searcher KB set
  path: "schema/ taxonomy/ validators/ tools/ prompts/ calibration/ knowledge_base/ specialists/ dist/"
  repo: tmundi3210/automation
  status: active
  purpose: Turn any domain into gated dense KBs + distilled prompt-only specialists behind one router.
  stack: Python 3.11 stdlib; JSON KBs (schema v1.3); bash gates; JSONL dist.
  architecture: taxonomy -> 3 dense KBs/domain (35-check gate) -> distilled specialist (13-check gate) -> INDEX + ROUTER.
  models: model-agnostic by design (prompt payloads for any model)
  orchestration_pattern: orchestrator + helper authors + deterministic Python gate as arbiter
  memory_strategy: none at runtime; KBs are the knowledge store
  topics: [agent_loops, tool_use_mcp, context_engineering, memory_retrieval, rag_knowledge_graphs, evaluation_frameworks]
  topic_exclusions: [social_media_automation, image_video_workflows]
  evals: ["python3 validators/kb_validator.py <KB> --mode dense", "python3 validators/specialist_validator.py <SPEC>", "bash tools/gate_all.sh --repo", "python3 -m unittest validators/test_kb_validator.py"]
  baseline: "gate_all fingerprint bd8210c23eee; 93 KBs + 31 specialists all_pass"
  protected: [validators/, tools/compute_kb_formulas.py, tools/build_router.py, tools/build_index.py, schema/, specialists/ROUTER.json, dist/prompt_template.json]
  deployment: none (in-repo artifact set)
  risk: HIGH   # shared substrate of every other project
  autonomy_level: L2   # recommend only; changes via EXCHANGE task + gates + operator visibility

- id: exchange_protocol
  name: EXCHANGE multi-agent collaboration protocol
  path: "EXCHANGE/ incoming/ inbox/ tools/check_scope.sh tools/gate_all.sh tools/status.py"
  repo: tmundi3210/automation
  status: active
  purpose: Governance channel for 3 model-family agents coordinating through the repo as message bus.
  stack: markdown message protocol; JSON ledgers; bash gates; per-task branches.
  architecture: builders on scoped branches -> self-gate -> submit DELIVERED-SHA -> integrator re-verifies, merges --no-ff, verdicts.
  models: Claude Code (integrator) + Grok CLI + Codex CLI (builders), three families as cross-verification
  orchestration_pattern: single-writer integrator; zero-token polling gates; trust-score routing (SCORING.md)
  memory_strategy: ledgers (tasks.json, scores.json) + STATUS.md digest; messages append-only
  topics: [multi_agent_coordination, agent_loops, context_engineering, evaluation_frameworks, security_prompt_injection, cost_latency]
  topic_exclusions: [image_video_workflows]
  evals: ["bash tools/check_scope.sh --agent <a> --task TASK-NNN", "bash tools/gate_all.sh --task <dir>", "python3 tools/status.py"]
  baseline: "10 tasks integrated; per-lane trust scores in scores.json"
  protected: [EXCHANGE/ORCHESTRATION.md, EXCHANGE/AGENTS.json, EXCHANGE/tasks.json, tools/gate_all.sh, tools/check_scope.sh]
  deployment: live (operator Mac schedulers + hub Routine)
  risk: MED
  autonomy_level: L4   # may draft tasks/PR content autonomously; policy/gate edits operator-approved

