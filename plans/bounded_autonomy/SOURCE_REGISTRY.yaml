# SOURCE_REGISTRY.yaml — SPEC Phase 3 deliverable
# Bounded-Autonomy AI Intelligence System
# Generated 2026-07-13. Requirements source: plans/bounded_autonomy/SPEC.md (Phase 3).
# Seed provenance: incoming/task-013__ai-prod-sources/SOURCES.md (every seed URL
# from that file was HTTP-checked 200 on 2026-07-13 by TASK-013). Rows added in
# this session that could NOT be re-verified (session proxy returned 403/blocked
# for github.com, arxiv rss, x.ai, openai dev portal, huggingface.co) are marked
# verification: UNVERIFIED — the URLs are well-known but must be HTTP-checked
# before the poller is enabled against them.
# Discipline applied: libarch (appraise authority/proximity/bias before trust;
# vendor flags carried, not hidden; evidence labels over apparent precision),
# infosci (stable ids, controlled type/tier enums), kr (scores are declared
# null-until-observed rather than invented — heuristic priors stay labeled).

_schema:
  version: "1.0.0"
  status: draft_for_review
  id_policy: "source_id is snake_case, stable forever; never reused. Renaming a source keeps the id."
  scoring_policy: >
    accuracy_history, snr_score, duplicate_rate, and relevance are OBSERVED
    metrics computed by the pipeline from this system's own ingestion history.
    They start null with bootstrap: true and are first populated after a 30-day
    observation window (monthly source-quality review). No score in this file
    may be hand-invented; a null score is information, not a defect.
  source_fields:
    # Every per-source field required by SPEC Phase 3, with types.
    source_id: "string, snake_case, unique, stable (SPEC: Source ID)"
    url: "string|null — exact canonical URL, account, or repository (SPEC: exact feed, API, repository, account, or URL)"
    feed: "string|null — machine-pollable feed endpoint (RSS/Atom/JSON) if distinct from url"
    api: "string|null — API endpoint if polled via API rather than feed/scrape"
    type: "enum: official_docs | changelog_release_notes | repository_releases | paper_listing | paper | benchmark | blog | engineering_writeup | newsletter | podcast | youtube_channel | conference_talks | x_list | aggregator | case_study"
    tier: "enum: A | B | C (SPEC tiering: A=primary evidence, B=early signals, C=synthesis/interpretation)"
    topics: "list of topic ids from TOPIC_ONTOLOGY.yaml (SPEC: topic coverage)"
    expected_latency: "enum: minutes | hours | days | weekly | monthly — typical lag behind the original event (SPEC: expected update latency)"
    poll_mechanism: "enum: webhook | rss_event | rss_daily | api_poll_1_3h | api_poll_daily | scrape_daily | static | none (SPEC: polling/event mechanism). Must be consistent with cadence_policy."
    accuracy_history: "number 0..1 | null — fraction of this source's claims that later verified (SPEC: accuracy history)"
    snr_score: "number 0..1 | null — fraction of ingested items that were decision-relevant (SPEC: signal-to-noise score)"
    duplicate_rate: "number 0..1 | null — fraction of items already ingested from an earlier source (SPEC: duplicate rate)"
    relevance: "number 0..1 | null — observed topical relevance to subscribed projects (SPEC: relevance score)"
    primary_proximity: "enum: primary | near_primary | secondary | aggregator (SPEC: primary-source proximity). Structural property, assessable at registration."
    repro_availability: "enum: always | frequent | occasional | rare | none (SPEC: code/reproducibility availability)"
    license_constraints: "string — license and ingestion constraints (SPEC). Default posture: store hash+extract+link; do not republish full text."
    rate_limits_cost: "string — rate limits and estimated cost (SPEC)"
    enabled: "boolean (SPEC: enabled/disabled status). Rows with verification UNVERIFIED or status pending_resolution must be enabled: false until checked."
    # Registry-management fields (beyond SPEC minimum):
    bootstrap: "boolean — true until first monthly source-quality review populates scores"
    bias_flags: "list of strings — vendor/incentive flags carried verbatim from appraisal (e.g. 'vendor: LangChain'). A flag is a weighting input, not a ban."
    status: "enum: active | probation | pending_resolution | disabled_dead_link | pruned"
    verification: "string — how/when the URL was last confirmed live; 'UNVERIFIED' if never confirmed by this system"
    provenance: "string — how this source entered the registry (seed list, discovery edge, human)"
    notes: "string|null"

cadence_policy:
  # SPEC Phase 3, verbatim:
  spec_verbatim: |
    Initial suggested cadence:

    - Webhooks or release feeds: event-driven where possible
    - Official announcements and high-priority X lists: metadata check every 1–3 hours
    - Repositories, package releases, papers, and documentation: daily
    - Newsletter and podcast RSS: on publication or daily
    - Daily project-specific digest
    - Weekly architecture and technique synthesis
    - Monthly source-quality and source-pruning review

    Only invoke expensive model analysis when new or materially changed content is detected.
  implementation_note: >
    poll_mechanism on each row maps onto these lines: webhook/rss_event =
    event-driven; api_poll_1_3h = official announcements and high-priority X
    lists; api_poll_daily/rss_daily/scrape_daily = repositories, packages,
    papers, docs, newsletters, podcasts. "Materially changed" is decided by
    normalized_hash comparison (see DATA_SCHEMAS.md content_hash spec), never
    by a model call.

discovery_expansion:
  spec_verbatim: >
    The source-discovery process must expand from seed sources through
    citations, maintainers, repository contributors, referenced
    implementations, conference programs, and repeated first-to-signal
    performance. Rank sources by demonstrated value, not follower count.
  expansion_edges:
    - edge: citation
      rule: "Papers cited by (or citing) an ingested Tier-A paper become candidate sources; the paper's venue/author feed becomes a candidate feed."
    - edge: maintainer
      rule: "Maintainers of registered Tier-A repositories: their blogs/accounts become Tier-B candidates."
    - edge: contributor
      rule: "Recurring top contributors to registered repositories: same treatment as maintainers, lower initial weight."
    - edge: referenced_implementation
      rule: "Implementations referenced by evidence records (repos, gists with runnable code) become candidate Tier-A repository sources."
    - edge: conference_program
      rule: "Accepted-talk programs of conferences already producing verified evidence (e.g. the AI Engineer talk stream) are polled for new speaker/project sources."
    - edge: first_to_signal
      rule: "A source that is repeatedly FIRST to surface items later confirmed by Tier-A evidence earns first_to_signal credits; enough credits triggers a promotion proposal."
  candidate_intake:
    - "New candidates enter with status: probation, bootstrap: true, all observed scores null, enabled per human approval."
    - "Minimum 30 days of observation before any tier promotion."
  ranking_rule:
    - "Rank by demonstrated value: accuracy_history, snr_score, first_to_signal credits, primary_proximity, and per-project relevance."
    - "Follower counts, subscriber counts, and stars are NOT ranking inputs (SPEC verbatim: rank by demonstrated value, not follower count)."
  change_control:
    - "Adding/removing sources and changing polling frequency are bounded self-evolution proposals (SPEC Phase 11): the system proposes with before/after evidence; application follows AUTONOMY_POLICY.yaml. Monthly source-pruning review is the scheduled venue."

