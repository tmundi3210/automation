component: codex_cli
product: OpenAI Codex CLI
version:
  value: "0.140.0"
  evidence: "codex --version => codex-cli 0.140.0"
interface:
  value: "local CLI on macOS"
  evidence: "codex doctor => runtime macos-aarch64; repo detected true"
filesystem:
  value: "unrestricted filesystem in this local installation; network enabled"
  evidence: "codex doctor => filesystem unrestricted + network enabled; codex --help => --sandbox with read-only, workspace-write, danger-full-access"
shell_execution:
  value: "yes"
  evidence: "codex exec/review/apply/sandbox subcommands are present in codex --help"
scheduling:
  state_dir_before: "$HOME/.exchange-gate/"
  state_dir_after: "$HOME/.exchange-gate-codex/"
  status: "shared_with_grok_and_move_blocked_by_clone_only_scope"
  evidence:
    - "plans/bounded_autonomy/CAPABILITY_MATRIX.md flagged the last_seen_tip collision risk"
    - "incoming/task-016__capability-codex/gate_audit.sh reports the shared state dir and the target codex dir"
    - "local inspection found only $HOME/.exchange-gate and no separate $HOME/.exchange-gate-codex"
  note: "The task requested a de-conflict move, but this poll tick cannot write outside the repository clone."
verification:
  codex_version:
    method: "test"
    command: "codex --version"
    output_line: "codex-cli 0.140.0"
  sandbox_modes:
    method: "doc"
    command: "codex --help | rg -n '^-s, --sandbox|--dangerously-bypass-approvals-and-sandbox'"
    output_line: "sandbox policy selector is exposed with read-only, workspace-write, and danger-full-access"
  approval_flags:
    method: "doc"
    command: "codex --help | rg -n '--ask-for-approval|approval policy|on-request|never|on-failure'"
    output_line: "approval policies on-request, never, and deprecated on-failure are documented"
  web_search:
    method: "test"
    command: "codex --help | rg -n '^\\s*--search'"
    output_line: "--search exists and enables live web search"
  x_search:
    method: "doc"
    command: "codex --help | rg -n '(^\\s*--x-search|x-search)'"
    output_line: "UNVERIFIED: no X-search surface exposed in codex help or doctor"
  mcp_support:
    method: "doc"
    command: "codex --help | rg -n '(^\\s*mcp\\s+|mcp-server)'"
    output_line: "mcp and mcp-server commands are present"
  auth_method:
    method: "config"
    command: "codex doctor | rg -n 'auth mode|stored ChatGPT tokens|stored API key|auth storage mode'"
    output_line: "auth mode chatgpt; stored ChatGPT tokens true; stored API key false"
  rate_plan_limits:
    method: "config"
    command: "codex doctor | rg -n 'rate|quota|plan|limit'"
    output_line: "UNVERIFIED: no visible per-plan rate/usage limits in the emitted doctor output"
known_limits:
  - "No X-search surface was exposed by codex help or doctor."
  - "Version is current as installed but not latest available; update availability is informational only."
  - "Gate-state de-conflict remains unresolved because the required home-directory move is outside repo write scope."
