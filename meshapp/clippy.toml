# Protocol code must not read the OS clock: all time goes through meshcore::clock::Clock
# (BRIEF_v2 §4 "no timestamps decide anything"). The simulator and platform adaptors
# are the only places allowed to construct a Clock from the OS.
disallowed-methods = [
    { path = "std::time::SystemTime::now", reason = "use meshcore::clock::Clock" },
    { path = "std::time::Instant::now", reason = "use meshcore::clock::Clock" },
]
