[package]
name = "meshcore"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Protocol core for the offline BLE mesh coordination app (BRIEF_v2 P0): identity, roster DAG, groups, DTN relay, tasks, votes."
# AGPL-3.0-only applies while the default backend is libsignal; see README.md "Licence".
license = "AGPL-3.0-only"

[lib]
name = "meshcore"
path = "src/lib.rs"

[features]
default = ["backend-libsignal"]
backend-libsignal = ["dep:libsignal-protocol", "dep:async-trait"]
backend-vodozemac = ["dep:vodozemac"]

[dependencies]
libsignal-protocol = { workspace = true, optional = true }
vodozemac = { workspace = true, optional = true }
async-trait = { workspace = true, optional = true }
ed25519-dalek.workspace = true
x25519-dalek.workspace = true
sha2.workspace = true
hmac.workspace = true
hkdf.workspace = true
chacha20poly1305.workspace = true
snow.workspace = true
rusqlite.workspace = true
rand.workspace = true
rand_chacha.workspace = true
thiserror.workspace = true
zeroize.workspace = true
subtle.workspace = true
hex.workspace = true
unicode-security.workspace = true
unicode-normalization.workspace = true

[dev-dependencies]
proptest.workspace = true
