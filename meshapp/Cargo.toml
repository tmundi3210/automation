[workspace]
resolver = "3"
members = ["crates/meshcore", "sim/meshsim"]

[workspace.package]
edition = "2024"
rust-version = "1.85"
publish = false

[workspace.dependencies]
meshcore = { path = "crates/meshcore" }

# Crypto backends (see docs/decisions-assumed.md: libsignal default, vodozemac stub)
libsignal-protocol = { git = "https://github.com/signalapp/libsignal", tag = "v0.105.0" }
vodozemac = { version = "0.11.1", default-features = false }
async-trait = "0.1"

ed25519-dalek = { version = "3.0.0", features = ["zeroize", "hazmat"] }
x25519-dalek = { version = "3.0.0", default-features = false, features = ["static_secrets", "zeroize"] }
sha2 = "0.11"
hmac = "0.13"
hkdf = "0.13"
chacha20poly1305 = "0.11"
snow = "0.10"
rusqlite = { version = "0.40", features = ["bundled"] }
rand = "0.9"
rand_chacha = "0.9"
thiserror = "2"
zeroize = { version = "1", features = ["derive"] }
subtle = "2"
hex = "0.4"
unicode-security = "0.1"
unicode-normalization = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
clap = { version = "4", features = ["derive"] }
proptest = "1"

[profile.dev]
opt-level = 1            # the simulator and libsignal are slow at opt-level 0

[profile.dev.package."*"]
opt-level = 2

[profile.release]
debug = 1
