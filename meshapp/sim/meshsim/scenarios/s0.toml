[scenario]
name = "s0"
description = "Smoke test: 3 Android phones, one group, one verified pair, no partition."
duration_ms = 600_000
tick_ms = 100

[nodes]
android = 3
iphone = 0
stations = 0
iphone_foreground_duty = 1.0
android_slots = 7
battery_floor = 0.30

[radio]
latency_ms = 40
throughput_bytes_per_s = 15_000
frame_loss = 0.005
iphone_wake_ms = 10_000
wall_clock_offset_ms = [0, 0]

[groups]
[[groups.list]]
name = "main"
members = "all"
admins = [0]

[pairs]
explicit = [[1, 2]]

[traffic]
group_post_every_ms = 30_000
dm_every_ms = 45_000
text_bytes = [40, 300]

[[partition]]
at_ms = 0
fragments = "all"

[pass]
every_post_decrypts_after_rejoin = true
members_h_identical = true
no_solid_state_reverts = true
no_duplicate_ui_delivery = true
message_keys_deleted_after_delivery = true
zero_wall_clock_reads = true
drain_report = true
