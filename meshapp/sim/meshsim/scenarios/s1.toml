[scenario]
name = "s1"
description = "Earthquake: 40 users split into fragments of 18/14/8 for 6 h, then rejoin. One removal during the split."
duration_ms = 25_200_000
tick_ms = 100

[nodes]
android = 20
iphone = 20
stations = 0
iphone_foreground_duty = 0.30
android_slots = 7
battery_floor = 0.30

[radio]
latency_ms = 40
throughput_bytes_per_s = 15_000
frame_loss = 0.005
iphone_wake_ms = 10_000
wall_clock_offset_ms = [0, 0]

[groups]
[[groups.list]]
name = "main"
members = "all"
admins = [0, 1, 2, 18, 19]

[pairs]
random = 10

[traffic]
group_post_every_ms = 120_000
dm_every_ms = 600_000
text_bytes = [40, 300]

[[partition]]
at_ms = 0
fragments = "all"
[[partition]]
at_ms = 600_000
fragments = [["0..17"], ["18..31"], ["32..39"]]
[[partition]]
at_ms = 22_200_000
fragments = "all"

[[events]]
at_ms = 4_200_000
kind = "remove_member"
by = 0
subject = 25

[pass]
every_post_decrypts_after_rejoin = true
members_h_identical = true
no_solid_state_reverts = true
no_duplicate_ui_delivery = true
message_keys_deleted_after_delivery = true
removed_posts_labelled_or_rejected = true
zero_wall_clock_reads = true
drain_report = true
