[scenario]
name = "s-flood"
description = "S1 topology without a partition; node 39 floods 600 junk cells/min at a hub. Honest control and text traffic must stay within 2x baseline latency and junk must never exceed the L3 cap."
duration_ms = 3_600_000
tick_ms = 100

[nodes]
android = 20
iphone = 20
stations = 0
iphone_foreground_duty = 0.30
android_slots = 7
battery_floor = 0.30

[radio]
latency_ms = 40
throughput_bytes_per_s = 15_000
frame_loss = 0.005
iphone_wake_ms = 10_000
wall_clock_offset_ms = [0, 0]

[groups]
[[groups.list]]
name = "main"
members = "0..38"
admins = [0, 1, 2]

[pairs]
random = 10

[traffic]
group_post_every_ms = 120_000
dm_every_ms = 600_000
text_bytes = [40, 300]

[[partition]]
at_ms = 0
fragments = "all"

[[events]]
at_ms = 900_000
kind = "adversary"
node = 39
behaviour = "flood"
cells_per_min = 600

[pass]
every_post_decrypts_after_rejoin = true
members_h_identical = true
no_solid_state_reverts = true
no_duplicate_ui_delivery = true
zero_wall_clock_reads = true
flood_honest_latency_factor_max = 2.0
flood_junk_within_l3_cap = true
drain_report = true
